name: Build and deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Create GitHub deployment
      uses: chrnorm/deployment-action@releases/v1
      id: deployment
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        description: 'Website'
        environment: Prod

    - name: Build and deploy on server
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ vars.REMOTE_HOST }}
        username: ${{ vars.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          export DEPLOY_DIR=/var/www/nick-iv.me

          if [ -f "${DEPLOY_DIR}/scripts/deploy/bootstrap-repository.sh" ]; then
            bash "${DEPLOY_DIR}/scripts/deploy/bootstrap-repository.sh"
          else
            curl -fsSL "https://raw.githubusercontent.com/nim579/nick-iv/master/scripts/deploy/bootstrap-repository.sh" \
              | DEPLOY_DIR="${DEPLOY_DIR}" bash
          fi

          bash "${DEPLOY_DIR}/scripts/deploy/deploy.sh"

    - name: Update deployment status (success)
      if: success()
      uses: chrnorm/deployment-status@releases/v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        target_url: https://nick-iv.me/
        state: 'success'
        deployment_id: ${{ steps.deployment.outputs.deployment_id }}

    - name: Update deployment status (failure)
      if: failure()
      uses: chrnorm/deployment-status@releases/v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        state: 'failure'
        deployment_id: ${{ steps.deployment.outputs.deployment_id }}
