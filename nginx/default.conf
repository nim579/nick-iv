server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/ld+json application/xml image/svg+xml;

    include snippets/security-headers.conf;

    # Hashed build output: cache forever.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Never serve dotfiles (e.g. build manifests).
    location ~ /\. {
        return 404;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=604800";
        include snippets/security-headers.conf;
    }

    # Pages: always revalidate, assets inside are hashed.
    location / {
        add_header Cache-Control "no-cache";
        include snippets/security-headers.conf;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include snippets/security-headers.conf;
    }
}
